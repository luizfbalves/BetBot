<nav>
    <button onClick = "operation()"> Operação </button>
    <button onClick = "configuration()"> Configurações </button>
    <img src="images/logo.svg" alt="logo betbot" onClick = "welcome()">
    <button class = "logout" onClick="open_login()"> 
        Login 
    </button>
    
    <div class="login" onClick = "toggle_user_container()">
        <img 
            src="images/user.svg" alt="user icon">
        <p id = "actual_value2"> R$0,00 </p>
    </div>
</nav>

<div class="login-container" onload="loaded()">
    <div class="blur" onClick="close_login()"></div>
    <div class="login-panel">
        <div class="username">
            <input 
                type="text" 
                placeholder="Usuário" 
                autocapitalize="off" 
                autocomplete="off" 
                autocorrect="off"
                id = "username"
            >
            <button class="clear" onClick="cleanup_username()">
                <img src="images/x.svg"></img>
            </button>
        </div>
        <div class="password">
            <input 
                type="password" 
                placeholder="Senha" 
                autocapitalize="off" 
                autocomplete="off" 
                autocorrect="off"
                id = "password"
            >
        </div>  
        <button class = "green-btn" onClick="handle_login()"> 
            Login 
        </button>
        <button class = "blue-btn" onClick="show_register()"> 
            Cadastrar 
        </button>
    </div>
</div>

<div class="register-container">
    <div class="blur" onClick="close_register()"></div>
    <div class="register-panel">
        <h3>Criar Nova Conta</h3>
        <div class="username">
            <input 
                type="text" 
                placeholder="Novo Usuário" 
                autocapitalize="off" 
                autocomplete="off" 
                autocorrect="off"
                id = "new_username"
            >
            <button class="clear" onClick="cleanup_new_username()">
                <img src="images/x.svg"></img>
            </button>
        </div>
        <div class="password">
            <input 
                type="password" 
                placeholder="Nova Senha" 
                autocapitalize="off" 
                autocomplete="off" 
                autocorrect="off"
                id = "new_password"
            >
        </div>
        <div class="password">
            <input 
                type="password" 
                placeholder="Confirmar Senha" 
                autocapitalize="off" 
                autocomplete="off" 
                autocorrect="off"
                id = "confirm_password"
            >
        </div>
        <button class = "green-btn" onClick="handle_register()"> 
            Criar Conta 
        </button>
        <button class = "gray-btn" onClick="close_register()"> 
            Cancelar 
        </button>
    </div>
</div>

<div class="user-container">
    <section class="values">
        <div class="values">
            <p> Saldo original </p>
            <p id = "original_value"> R$0,00 </p>
        </div>
        <div class="values">
            <p> Saldo atual </p>
            <p id = "actual_value"> R$10,00 </p>
        </div>
    </section>
    <section class="business">
        <button class="beauty-btn" onClick = "logout()">
            Sair
        </button>
    </section>
</div>

<script>
    if (localStorage.getItem('account')) {
        login(JSON.parse(localStorage.getItem('account')))
    }
</script>
